<!-- In index.html, find the existing nav links (line 624 in the inspected version):
     <a href="#markets">Markets</a><a href="#contact">Contact</a>
     Replace that sequence with this (preserve all other links): -->
<a href="#markets">Markets</a><a href="#contact">Contact</a><a href="./hs-assistant.html">Customer Support</a>

<!-- Add immediately before </body> in index.html. This is an isolated, responsive launcher. -->
<style>
#hs-launcher{position:fixed;right:22px;bottom:22px;z-index:9998;border:1px solid #c99a43;border-radius:999px;background:#102b3f;color:#fff;padding:13px 18px;font:700 13px system-ui;box-shadow:0 8px 28px #102b3f40;cursor:pointer}
#hs-frame-wrap{position:fixed;right:22px;bottom:84px;width:min(420px,calc(100vw - 28px));height:min(690px,calc(100dvh - 115px));z-index:9999;background:#fff;border:1px solid #c99a43;border-radius:8px;overflow:hidden;box-shadow:0 18px 60px #102b3f45;display:none}
#hs-frame-wrap.open{display:block}#hs-frame-wrap iframe{width:100%;height:100%;border:0}
@media(max-width:560px){#hs-launcher{right:14px;bottom:14px;padding:12px 15px}#hs-frame-wrap{right:8px;bottom:70px;width:calc(100vw - 16px);height:calc(100dvh - 84px)}}
</style>
<button id="hs-launcher" type="button" aria-expanded="false" aria-controls="hs-frame-wrap">✦ Customer Support</button>
<div id="hs-frame-wrap" role="dialog" aria-label="Hindustani Spices Assistant">
  <iframe src="./hs-assistant.html?embed=1" title="Hindustani Spices Assistant" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="clipboard-write"></iframe>
</div>
<script>
(()=>{const b=document.getElementById('hs-launcher'),w=document.getElementById('hs-frame-wrap');if(!b||!w)return;b.addEventListener('click',()=>{const open=w.classList.toggle('open');b.setAttribute('aria-expanded',String(open));b.textContent=open?'× Close Support':'✦ Customer Support'});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&w.classList.contains('open')){w.classList.remove('open');b.setAttribute('aria-expanded','false');b.textContent='✦ Customer Support'}})})();
</script>
